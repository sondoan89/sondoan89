name: 🐛 Bug Report
description: File a bug report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue!
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Runtime version, Browser, etc.
      placeholder: Windows 11, Node 20, Chrome 120...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed reproduction steps.
      placeholder: |
        1. Run `...`
        2. Click on `...`
        3. See error
    validations:
      required: true
